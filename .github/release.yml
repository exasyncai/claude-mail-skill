changelog:
  exclude:
    labels:
      - skip-changelog
      - dependencies
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: New
      labels: [feature, enhancement]
    - title: Fixed
      labels: [bug, fix]
    - title: Security
      labels: [security]
    - title: Docs
      labels: [documentation]
    - title: Other
      labels: ["*"]
